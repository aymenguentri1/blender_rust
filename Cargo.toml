[package]
name = "blender-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
fontdue = "0.9"
ruzstd = "0.9.1"
gif = { version = "0.13", default-features = false, features = ["std", "color_quant"] }

[profile.dev]
opt-level = 3


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

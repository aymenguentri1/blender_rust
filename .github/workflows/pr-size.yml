name: PR size and issue link
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
jobs:
  pr-size:
    name: pr-size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_pr_size.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
